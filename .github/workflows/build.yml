name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProfanityDelay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Vosk model
        id: cache-vosk
        uses: actions/cache@v4
        with:
          path: ProfanityDelay/app/src/main/assets/vosk-model.zip
          key: vosk-model-small-en-us-0.15

      - name: Download Vosk speech model
        if: steps.cache-vosk.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/vosk-model.zip \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: profanity-delay-debug-apk
          path: ProfanityDelay/app/build/outputs/apk/debug/app-debug.apk
