plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.preston.profanitydelay'
    compileSdk 34

    defaultConfig {
        applicationId "com.preston.profanitydelay"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // The Vosk model ships as an already-compressed zip. Re-compressing it
    // during the build wastes huge amounts of memory for no benefit and was
    // the direct cause of the "Java heap space" build failure.
    aaptOptions {
        noCompress "tflite", "model", "vosk", "zip"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
